services:
  # ---------------------------------------------------------------------------
  # Nexus Unified Query API & Persistence Engine (100% Free Tier Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: nexus-query-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_WRITE_PROJECT_ID
        sync: false
      - key: APP_WRITE_API_ENDPOINT
        sync: false
      - key: APP_WRITE_API_KEY
        sync: false
      - key: APP_WRITE_BUCKET_ID
        sync: false
      - key: WORKER_COUNT
        value: "2"
      - key: GLOBAL_MAX_PAGES
        value: "50"
      - key: MAX_DEPTH
        value: "2"
