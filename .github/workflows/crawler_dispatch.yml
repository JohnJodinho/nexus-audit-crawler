name: Ephemeral Crawl Dispatch

on:
  workflow_dispatch:
    inputs:
      crawl_id:
        description: "Crawl identifier namespace"
        required: false
        default: ""
      seed_url:
        description: "Seed URL to crawl and audit (if triggering manually)"
        required: false
        default: "https://www.umgc.edu/current-students"
      max_pages:
        description: "Maximum pages to crawl"
        required: false
        default: "15"
      max_depth:
        description: "Maximum depth"
        required: false
        default: "2"
      worker_count:
        description: "Worker concurrency (1 to 4)"
        required: false
        default: "2"

jobs:
  run-crawl:
    name: Execute Ephemeral Crawl Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Patchright Browsers
        uses: actions/cache@v4
        id: patchright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-patchright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-patchright-

      - name: Install Chromium for StealthyFetcher
        run: python -m patchright install chromium --with-deps
        if: steps.patchright-cache.outputs.cache-hit != 'true'

      - name: Execute Crawl Job
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_WRITE_PROJECT_ID: ${{ secrets.APP_WRITE_PROJECT_ID }}
          APP_WRITE_API_ENDPOINT: ${{ secrets.APP_WRITE_API_ENDPOINT }}
          APP_WRITE_API_KEY: ${{ secrets.APP_WRITE_API_KEY }}
          APP_WRITE_BUCKET_ID: ${{ secrets.APP_WRITE_BUCKET_ID }}
          GLOBAL_MAX_PAGES: ${{ github.event.inputs.max_pages }}
          MAX_DEPTH: ${{ github.event.inputs.max_depth }}
          WORKER_COUNT: ${{ github.event.inputs.worker_count }}
          DATACENTER_PROXIES: ${{ secrets.DATACENTER_PROXIES }}
          RESIDENTIAL_PROXIES: ${{ secrets.RESIDENTIAL_PROXIES }}
        run: |
          CRAWL_ID="${{ github.event.inputs.crawl_id }}"
          if [ -z "$CRAWL_ID" ]; then
            CRAWL_ID="gh-$(date +%s)"
            echo "Manual trigger: Enqueuing seed ${{ github.event.inputs.seed_url }} under $CRAWL_ID..."
            python -m app.orchestrator --url "${{ github.event.inputs.seed_url }}" --crawl-id "$CRAWL_ID" --depth ${{ github.event.inputs.max_depth }}
          else
            echo "API triggered: Consuming Redis tasks for existing crawl $CRAWL_ID..."
          fi

          export CRAWL_ID="$CRAWL_ID"
          echo "Starting Scrapling crawler workers for crawl ID: $CRAWL_ID..."
          python -m app.main

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-logs-${{ github.run_id }}
          path: app/logs/
          retention-days: 14
